<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a6ebd"><title>Swim Periodization Planner</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#f6f8fa;--sf:#fff;--tx:#14202b;--mu:#5f6f7d;--bd:#d5dde4;--ac:#0a6ebd;--hd:#e3edf5;--cur:#fff3c4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10171d;--sf:#18222b;--tx:#e8eef3;--mu:#97a7b4;--bd:#2e3d49;--ac:#4aa8ec;--hd:#1f2d39;--cur:#4a4120}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10171d;--sf:#18222b;--tx:#e8eef3;--mu:#97a7b4;--bd:#2e3d49;--ac:#4aa8ec;--hd:#1f2d39;--cur:#4a4120}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:18px;margin:0 auto 0 0}
button,input{font:inherit;color:var(--tx)}
button{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
label{color:var(--mu);font-size:13px}
input[type=date]{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:5px}
#leg{padding:0 14px 8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer;background:var(--sf)}
.chip.on{outline:2px solid var(--ac)}
#sum{padding:0 14px 8px;color:var(--mu);font-size:13px}
.wrap{overflow:auto;max-height:calc(100vh - 190px);border-top:1px solid var(--bd)}
table{border-collapse:separate;border-spacing:0}
th,td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:0;min-width:64px;height:30px;background:var(--sf)}
th.l{position:sticky;left:0;z-index:2;min-width:140px;max-width:140px;text-align:left;padding:4px 8px;background:var(--hd);font-weight:600;font-size:12px}
tr.h th,tr.h td{background:var(--hd);text-align:center;font-size:12px;color:var(--mu)}
td.cur{background:var(--cur)!important}
td input{width:100%;height:100%;min-height:29px;border:0;background:transparent;text-align:center;padding:2px;font-size:12px}
td input:focus{outline:2px solid var(--ac);outline-offset:-2px}
td input[type=checkbox]{width:18px;height:18px;min-height:0}
.sec th.l{background:var(--ac);color:#fff}
[data-c=X]{background:#e5484d!important;color:#fff}[data-c=T]{background:#9aa5b1!important}
[data-c=GP]{background:#7cc4fa!important;color:#06263f}[data-c=SP]{background:#3b82f6!important;color:#fff}
[data-c=PC]{background:#f5a524!important;color:#2b1a00}[data-c=C]{background:#ef6a3a!important;color:#fff}
[data-c=AA]{background:#a7e3b4!important;color:#0c3317}[data-c=MXS]{background:#2f9e5a!important;color:#fff}
[data-c=P]{background:#b58cf0!important;color:#240c4b}[data-c="P-E"]{background:#7e57c2!important;color:#fff}
[data-c=CO]{background:#f2d675!important;color:#3a2e00}[data-c=ET]{background:#5ad1c6!important;color:#00332f}
[data-c=COD]{background:#f08fbd!important;color:#4a0a28}
td[data-c] input{color:inherit;font-weight:600}
</style></head><body>
<header><h1>Swim Periodization Planner</h1>
<label>Week 1 starts <input type="date" id="start"></label>
<button id="exp">Export</button><button id="imp">Import</button><button id="clr">Clear</button>
<span id="st" style="color:var(--mu);font-size:12px"></span><input type="file" id="file" accept=".json" hidden></header>
<div id="leg"></div><div id="sum"></div>
<div class="wrap"><table id="t"></table></div>
<script>
const W=48,KEY="swimplan.v1";
const LEG=[["X","Main Competition"],["T","Transition"],["GP","General Prep"],["SP","Specific Prep"],["PC","Pre-Competition"],["C","Competition"],["AA","Anatomical Adaptation"],["MxS","Maximum Strength"],["P","Power"],["P-E","Power Endurance"],["Co","Compensation"],["ET","Extensive Tempo"],["COD","Change of Direction"]];
const ROWS=[["Competitions",["National","State","Location"]],["Plan",["Phases","Subphases","Macrocycles","Microcycles"]],["Biomotor abilities",["Strength","Speed & Agility","Endurance","Swimming Technique & Tactics"]],["Training load",["Planned km","Actual km"]],["Tracking",["Week done","Notes"]]];
let S={start:"",c:{}},brush=null;
const stat=m=>{st.textContent=m};
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("swim",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbGet(){const d=await idb();return new Promise(res=>{const q=d.transaction("kv").objectStore("kv").get("plan");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
async function idbSet(v){const d=await idb();return new Promise(res=>{const tx=d.transaction("kv","readwrite");tx.objectStore("kv").put(v,"plan");tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)})}
let tm;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(tm);tm=setTimeout(()=>idbSet(JSON.stringify(S)).then(ok=>stat(ok?"Saved "+new Date().toLocaleTimeString():"Save failed - export a backup")),150)};
addEventListener("visibilitychange",()=>{if(document.hidden)idbSet(JSON.stringify(S))});
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const wkDate=w=>{if(!S.start)return"";const d=new Date(S.start+"T00:00");d.setDate(d.getDate()+7*w);return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})};
const curWeek=()=>{if(!S.start)return-1;const w=Math.floor((Date.now()-new Date(S.start+"T00:00"))/6048e5);return w>=0&&w<W?w:-1};
function render(){
 const cw=curWeek();let h="<tr class=h><th class=l>Month</th>";
 for(let m=0;m<12;m++)h+=`<td colspan=4>Month ${m+1}</td>`;
 h+="</tr><tr class=h><th class=l>Week starting</th>";
 for(let w=0;w<W;w++)h+=`<td class="${w==cw?"cur":""}">${wkDate(w)||"-"}</td>`;
 h+="</tr><tr class=h><th class=l>Week</th>";
 for(let w=0;w<W;w++)h+=`<td class="${w==cw?"cur":""}">${w+1}</td>`;
 h+="</tr>";
 for(const[sec,rs]of ROWS){h+=`<tr class=sec><th class=l colspan=1>${sec}</th><td colspan=${W} style="background:var(--hd)"></td></tr>`;
  for(const r of rs){h+=`<tr><th class=l>${r}</th>`;
   for(let w=0;w<W;w++){const k=r+"|"+w,v=S.c[k]||"";
    if(r=="Week done")h+=`<td class="${w==cw?"cur":""}"><input type=checkbox data-k="${k}" ${v?"checked":""}></td>`;
    else h+=`<td class="${w==cw?"cur":""}" ${/km|Notes/.test(r)?"":`data-c="${esc(v.toUpperCase())}"`}><input data-k="${k}" value="${esc(v)}" ${r.includes("km")?'inputmode=decimal':""}></td>`}
   h+="</tr>"}}
 t.innerHTML=h;summary()}
function summary(){let p=0,a=0,d=0;for(let w=0;w<W;w++){p+=+S.c["Planned km|"+w]||0;a+=+S.c["Actual km|"+w]||0;d+=S.c["Week done|"+w]?1:0}
 sum.textContent=`Planned ${p} km | Actual ${a} km${p?" ("+Math.round(a/p*100)+"%)":""} | Weeks done ${d}/${W}`}
function set(k,v,el){if(v)S.c[k]=v;else delete S.c[k];save();summary();const td=el.parentElement;if(td.hasAttribute("data-c"))td.dataset.c=v.toUpperCase()}
t.addEventListener("input",e=>{const el=e.target,k=el.dataset.k;if(!k)return;set(k,el.type=="checkbox"?(el.checked?"1":""):el.value,el)});
t.addEventListener("click",e=>{const el=e.target;if(!brush||el.tagName!="INPUT"||el.type=="checkbox")return;const td=el.parentElement;if(!td.hasAttribute("data-c"))return;el.value=el.value==brush?"":brush;set(el.dataset.k,el.value,el);el.blur()});
leg.innerHTML=LEG.map(([c,n])=>`<span class=chip data-c="${c.toUpperCase()}" data-b="${c}" title="${n}">${c} ${n}</span>`).join("");
leg.addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;brush=brush==c.dataset.b?null:c.dataset.b;[...leg.children].forEach(x=>x.classList.toggle("on",x.dataset.b==brush))});
start.value=S.start||"";start.onchange=()=>{S.start=start.value;save();render()};
exp.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="swim-plan.json";a.click()};
imp.onclick=()=>file.click();
file.onchange=async()=>{try{S=JSON.parse(await file.files[0].text());start.value=S.start||"";save();render()}catch(e){alert("Could not read that file")}};
clr.onclick=()=>{if(confirm("Clear the whole plan?")){S={start:S.start,c:{}};save();render()}};
(async()=>{try{let r=await idbGet();if(!r)r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
start.value=S.start||"";render();
try{const p=navigator.storage&&await navigator.storage.persist();stat(p?"Storage protected":"Storage not guaranteed - export backups")}catch(e){}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});})();
</script></body></html>
